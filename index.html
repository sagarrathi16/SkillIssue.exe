<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namma Fragile OS | SynapseX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0e0e17] text-gray-100 overflow-hidden select-none antialiased font-sans">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var errEl = document.getElementById('debug-error-overlay');
        if (!errEl) {
          errEl = document.createElement('div');
          errEl.id = 'debug-error-overlay';
          errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#180b0b;color:#ff6b6b;padding:24px;font-family:monospace;font-size:14px;z-index:999999;overflow:auto;white-space:pre-wrap;line-height:1.5;';
          document.body.appendChild(errEl);
        }
        errEl.innerHTML = '<h2 style="color:#ff4444;font-size:18px;margin-bottom:12px;">🚨 Browser JavaScript Error:</h2>' +
          '<strong>Error:</strong> ' + e.message + '\n' +
          '<strong>Location:</strong> ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\n' +
          '<strong>Stack Trace:</strong>\n' + (e.error && e.error.stack ? e.error.stack : '(no stack available)');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Captured unhandled rejection:', e);
        var errEl = document.getElementById('debug-error-overlay');
        if (!errEl) {
          errEl = document.createElement('div');
          errEl.id = 'debug-error-overlay';
          errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#180b0b;color:#ff6b6b;padding:24px;font-family:monospace;font-size:14px;z-index:999999;overflow:auto;white-space:pre-wrap;line-height:1.5;';
          document.body.appendChild(errEl);
        }
        errEl.innerHTML = '<h2 style="color:#ff4444;font-size:18px;margin-bottom:12px;">🚨 Unhandled Promise Rejection:</h2>' +
          (e.reason && e.reason.stack ? e.reason.stack : e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
